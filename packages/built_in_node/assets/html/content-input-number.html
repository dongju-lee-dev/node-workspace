<input id="built-in-node-content-input-number" type="number">
<style>
    #built-in-node-content-input-number {
        padding: 2px 6px;
        font-size: 15px;
        color: var(--text-color);
        background: var(--background-color);
        border: 1px solid var(--border-color);
        border-radius: 5px;
    }

    #built-in-node-content-input-number[type="number"] {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        margin: 0;
    }

    #built-in-node-content-input-number[type="number"]::-webkit-inner-spin-button,
    #built-in-node-content-input-number[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
</style>
<script>
    const workSpace = dataBase.get('workSpace');
    const input = node.querySelector('#built-in-node-content-input-number');

    if (content !== null) {
        input.value = content;
    }

    if (!('run' in node)) {
        input.addEventListener('change', e => {
            workSpace.contentNode(node.id, input.value);
        });
        input.addEventListener('mousedown', e => {
            if (e.button === 0) e.stopPropagation();
        });

        node.run = false;
    }
</script>
