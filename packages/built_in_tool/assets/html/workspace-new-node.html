<div id="workspace-new-node">
    <style>
        #workspace-new-node {
            display: none;
            overflow: auto;
            position: absolute;
            flex-direction: column;
            top: 0px;
            left: 0px;
            width: 250px;
            height: 300px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
        }

        #workspace-new-node::-webkit-scrollbar {
            width: 8px;
            background: var(--background-color);
            border-radius: 5px;
        }

        #workspace-new-node::-webkit-scrollbar-thumb {
            background: var(--point-small-color);
            border-radius: 5px;
        }

        #workspace-new-node::-webkit-scrollbar-thumb:hover {
            background: var(--point-color);
        }

        #workspace-new-node::-webkit-scrollbar-track {
            background: var(--background-color);
            border-radius: 5px;
        }

        .workspace-node {
            color: var(--text-color);
            padding: 2px 10px 2px 10px;
            border-radius: 2.5px;
        }

        .workspace-node:hover {
            color: var(--text-color-hover);
            background-color: var(--point-color);
        }
    </style>
</div>
