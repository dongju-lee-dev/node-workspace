<div id="space">
    <svg id="space-nodelink-svg">
        <defs>
            <filter id="space-nodelink-select" filterUnits="objectBoundingBox" x="0" y="0" width="100%" height="100%">
                <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="expanded" />
                <feFlood flood-color="var(--point-small-color)" flood-opacity="1" result="color" />
                <feComposite in="color" in2="expanded" operator="in" result="shadow-mask" />

                <feGaussianBlur in="shadow-mask" stdDeviation="2" result="blurred-shadow" />

                <feOffset in="blurred-shadow" dx="0" dy="0" result="offset-shadow" />

                <feMerge>
                    <feMergeNode in="offset-shadow" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <g id="space-nodelink"></g>
    </svg>
    <div id="space-node"></div>
</div>
<div id="command"></div>
<style>
    :host {
        position: fixed;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        background-color: rgb(64, 64, 64);
    }

    #space {
        transform-origin: left top;
    }

    #space-nodelink-svg {
        position: absolute;
        transform: translateX(calc(100000vw / -2)) translateY(calc(100000vh / -2));
        width: 100000vw;
        height: 100000vh;
    }

    #space-nodelink {
        transform: translateX(calc(100000vw / 2)) translateY(calc(100000vh / 2));
        fill: none;
        stroke: var(--border-color);
        stroke-width: 3px;
    }

    #command {
        display: none;
        position: absolute;
        flex-direction: column;
        width: 265px;
        background-color: var(--background-color);
        border: 1px solid var(--border-color);
        border-radius: 5px;
    }

    .comamnd-menu-group {
        width: var(100% - 10px);
        padding: 5px;
    }

    .command-menu {
        color: var(--text-color);
        padding: 0px 20px 0px 20px;
    }

    .command-menu:hover {
        color: var(--text-color-hover);
        background-color: var(--point-color);
        border-radius: 2.5px;
    }

    .command-line {
        height: 1px;
        margin: 0px 5px 0px 5px;
        background-color: var(--border-color);
    }
</style>
